<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- 主背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="35%" style="stop-color:#141050"/>
      <stop offset="65%" style="stop-color:#201468"/>
      <stop offset="100%" style="stop-color:#0d0d35"/>
    </linearGradient>

    <!-- 卡片渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1858"/>
      <stop offset="45%" style="stop-color:#271e78"/>
      <stop offset="100%" style="stop-color:#181450"/>
    </linearGradient>

    <!-- 金色文字渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="25%" style="stop-color:#FFF4B0"/>
      <stop offset="50%" style="stop-color:#FFB800"/>
      <stop offset="75%" style="stop-color:#FFF4B0"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>

    <!-- 卖点卡片渐变 -->
    <linearGradient id="sellCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2570;stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:#1c1858;stop-opacity:0.55"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 光晕渐变 -->
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00D2FF;stop-opacity:0"/>
    </radialGradient>

    <!-- 装饰线渐变 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0"/>
      <stop offset="12%" style="stop-color:#6C5CE7;stop-opacity:0.9"/>
      <stop offset="88%" style="stop-color:#00D2FF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00D2FF;stop-opacity:0"/>
    </linearGradient>

    <!-- 紫调卡片强调渐变 -->
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C6FF7"/>
      <stop offset="100%" style="stop-color:#6C5CE7"/>
    </linearGradient>

    <!-- 青调卡片强调渐变 -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#33D9FF"/>
      <stop offset="100%" style="stop-color:#00B8D4"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景层 ===== -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- 网格装饰 -->
  <g opacity="0.04">
    <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="800" y2="480" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="640" x2="800" y2="640" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="800" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="800" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="800" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="800" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- 背景光晕 -->
  <circle cx="400" cy="360" r="280" fill="url(#aura1)"/>
  <circle cx="560" cy="260" r="200" fill="url(#aura2)"/>

  <!-- ===== 装饰几何元素 ===== -->
  <g opacity="0.1">
    <polygon points="70,70 105,35 140,70 105,105" fill="none" stroke="#6C5CE7" stroke-width="1.5"/>
    <polygon points="670,50 715,50 692,95" fill="none" stroke="#00D2FF" stroke-width="1.5"/>
    <circle cx="80" cy="690" r="22" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
    <line x1="695" y1="670" x2="740" y2="670" stroke="#00D2FF" stroke-width="1.2"/>
    <line x1="718" y1="648" x2="718" y2="692" stroke="#00D2FF" stroke-width="1.2"/>
  </g>

  <!-- ===== 主卡片 ===== -->
  <!-- 卡片外发光 -->
  <rect x="60" y="120" width="680" height="560" rx="30" fill="none" stroke="#6C5CE7" stroke-width="2.5" opacity="0.18" filter="url(#strongGlow)"/>

  <!-- 卡片主体 -->
  <rect x="66" y="126" width="668" height="548" rx="28" fill="url(#cardGrad)" stroke="#3a3090" stroke-width="1.5"/>

  <!-- 卡片内光晕 -->
  <ellipse cx="400" cy="270" rx="260" ry="100" fill="#6C5CE7" opacity="0.05"/>

  <!-- 卡片顶部装饰线 -->
  <line x1="130" y1="164" x2="670" y2="164" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- ===== 四角装饰 ===== -->
  <g opacity="0.25">
    <line x1="86" y1="146" x2="116" y2="146" stroke="#6C5CE7" stroke-width="2"/>
    <line x1="86" y1="146" x2="86" y2="176" stroke="#6C5CE7" stroke-width="2"/>
    <line x1="684" y1="146" x2="714" y2="146" stroke="#00D2FF" stroke-width="2"/>
    <line x1="714" y1="146" x2="714" y2="176" stroke="#00D2FF" stroke-width="2"/>
    <line x1="86" y1="654" x2="86" y2="624" stroke="#6C5CE7" stroke-width="2"/>
    <line x1="86" y1="654" x2="116" y2="654" stroke="#6C5CE7" stroke-width="2"/>
    <line x1="684" y1="654" x2="714" y2="654" stroke="#00D2FF" stroke-width="2"/>
    <line x1="714" y1="654" x2="714" y2="624" stroke="#00D2FF" stroke-width="2"/>
  </g>

  <!-- ===== 标题区 ===== -->
  <!-- 标题光晕背景 -->
  <ellipse cx="400" cy="195" rx="140" ry="30" fill="#FFD700" opacity="0.06" filter="url(#softGlow)"/>

  <!-- 主标题 -->
  <text x="400" y="199" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="50" font-weight="900" fill="url(#goldGrad)" filter="url(#glow)">大模型 Token 劵</text>

  <!-- 副标题 -->
  <text x="400" y="244" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" fill="#a0a8d8" letter-spacing="6">驱动AI干活 · 享受轻松人生</text>

  <!-- 标题下方装饰小点 -->
  <g opacity="0.3">
    <circle cx="340" cy="265" r="2.5" fill="#6C5CE7"/>
    <circle cx="370" cy="265" r="1.8" fill="#00D2FF"/>
    <circle cx="400" cy="265" r="2.5" fill="#FFD700"/>
    <circle cx="430" cy="265" r="1.8" fill="#00D2FF"/>
    <circle cx="460" cy="265" r="2.5" fill="#6C5CE7"/>
  </g>

  <!-- ===== 四大卖点（2×2 网格） ===== -->

  <!-- 卖点1：顶级AI模型（左上） -->
  <g transform="translate(108, 292)">
    <rect x="0" y="0" width="282" height="88" rx="14" fill="url(#sellCardGrad)" stroke="#4a3faa" stroke-width="1"/>
    <rect x="0" y="4" width="4" height="80" rx="2" fill="url(#purpleAccent)" opacity="0.8"/>
    <!-- 星形图标 -->
    <g transform="translate(40,44)" opacity="0.9">
      <polygon points="0,-16 4.5,-5 16,-5 7,2 10.5,13 0,6 -10.5,13 -7,2 -16,-5 -4.5,-5" fill="#FFD700"/>
    </g>
    <text x="76" y="32" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFE066">世界顶级模型</text>
    <text x="76" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9898cc">安全稳定 · 开箱即用 · 专业AI能力</text>
  </g>

  <!-- 卖点2：全能办公超算（右上） -->
  <g transform="translate(410, 292)">
    <rect x="0" y="0" width="282" height="88" rx="14" fill="url(#sellCardGrad)" stroke="#4a3faa" stroke-width="1"/>
    <rect x="0" y="4" width="4" height="80" rx="2" fill="url(#purpleAccent)" opacity="0.8"/>
    <!-- 文档+闪电图标 -->
    <g transform="translate(40,44)" opacity="0.9">
      <rect x="-11" y="-14" width="22" height="28" rx="2" fill="none" stroke="#FFD700" stroke-width="1.8"/>
      <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
      <line x1="-6" y1="0" x2="3" y2="0" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
      <polygon points="0,-22 4,-12 12,-12 6,-6 8,4 0,-3 -8,4 -6,-6 -12,-12 -4,-12" fill="#00D2FF" opacity="0.8"/>
    </g>
    <text x="76" y="32" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFE066">全能办公超算</text>
    <text x="76" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9898cc">Office文档编辑 · 企划编程一券搞定</text>
  </g>

  <!-- 卖点3：低于官方定价（左下） -->
  <g transform="translate(108, 400)">
    <rect x="0" y="0" width="282" height="88" rx="14" fill="url(#sellCardGrad)" stroke="#4a3faa" stroke-width="1"/>
    <rect x="0" y="4" width="4" height="80" rx="2" fill="url(#cyanAccent)" opacity="0.8"/>
    <!-- ¥金币图标 -->
    <g transform="translate(40,44)" opacity="0.9">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#FFD700" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFD700">¥</text>
    </g>
    <text x="76" y="32" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFE066">低至官方 1 折</text>
    <text x="76" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9898cc">纯福利放送 · 极致性价比</text>
  </g>

  <!-- 卖点4：多端无缝同步（右下） -->
  <g transform="translate(410, 400)">
    <rect x="0" y="0" width="282" height="88" rx="14" fill="url(#sellCardGrad)" stroke="#4a3faa" stroke-width="1"/>
    <rect x="0" y="4" width="4" height="80" rx="2" fill="url(#cyanAccent)" opacity="0.8"/>
    <!-- 多端同步图标 -->
    <g transform="translate(40,44)" opacity="0.9">
      <rect x="-16" y="-16" width="20" height="15" rx="2" fill="none" stroke="#6C5CE7" stroke-width="1.6"/>
      <line x1="-11" y1="-4" x2="-1" y2="-4" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
      <rect x="4" y="-6" width="7" height="12" rx="2" fill="none" stroke="#6C5CE7" stroke-width="1.4"/>
      <path d="M-3,-10 C0,-15 5,-15 8,-10" fill="none" stroke="#00D2FF" stroke-width="1.3"/>
    </g>
    <text x="76" y="32" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFE066">多端无缝同步</text>
    <text x="76" y="56" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9898cc">桌面端 &amp; 移动端 · 数据实时互通</text>
  </g>

  <!-- ===== 底部分隔线 ===== -->
  <line x1="150" y1="535" x2="650" y2="535" stroke="#3a3090" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- 支持模型 -->
  <text x="400" y="566" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#6262a0" letter-spacing="2">支持 DeepSeek · GLM · Kimi · MiMo  · GPT 等世界顶尖模型</text>

  <!-- 品牌标识 -->
  <rect x="320" y="585" width="160" height="28" rx="14" fill="#FFD700" opacity="0.1"/>
  <text x="400" y="604" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#FFD700" letter-spacing="3">虚拟数字商品</text>

  <!-- ===== 粒子装饰 ===== -->
  <g opacity="0.4">
    <circle cx="155" cy="230" r="2" fill="#6C5CE7"/>
    <circle cx="645" cy="215" r="1.8" fill="#00D2FF"/>
    <circle cx="200" cy="350" r="1.5" fill="#6C5CE7"/>
    <circle cx="600" cy="370" r="2" fill="#00D2FF"/>
    <circle cx="145" cy="480" r="1.3" fill="#6C5CE7"/>
    <circle cx="655" cy="490" r="1.2" fill="#00D2FF"/>
    <circle cx="280" cy="178" r="1.5" fill="#ffffff"/>
    <circle cx="520" cy="172" r="1" fill="#ffffff"/>
    <circle cx="380" cy="140" r="1.2" fill="#ffffff"/>
    <circle cx="440" cy="630" r="1.5" fill="#6C5CE7"/>
  </g>
</svg>
