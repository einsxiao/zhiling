<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知令合伙人计划 · 校园海报</title>
<style>
  /* ============ 基础与双画布自适应 ============
     设计基准：1080 × 1920（9:16）。
     1rem = min(100vw/1080, 100vh/1920) —— 屏幕 1080×1920 时恰为 1px；
     A3 竖版(297×420mm, 1:1.414) 打印时按高度贴合，左右自动留白居中。
  */
  html{
    font-size: min(0.0925926vw, 0.0520833vh);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html,body{margin:0;padding:0;background:#FFFFFF;}
  body{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;}
  *{box-sizing:border-box;}

  :root{
    --blue:#545BFC;
    --blue2:#7C6FF7;
    --grad:linear-gradient(135deg,#545BFC,#7C6FF7);
    --ink:#0E1024;
    /* 规格原值 #7A819A / #9AA0B4 在白底上仅 3.9:1 / 2.6:1，达不到 WCAG AA 4.5:1；
       故按"最小改动保对比度"原则压深到 5.4:1 / 5.2:1，观感仍为浅灰蓝弱化色。 */
    --ink2:#626A80;
    --muted:#656C82;
    --line:#E4E6F8;
    --line2:#D8DCF2;
  }

  .poster{
    position:relative;
    width:1080rem;
    height:1920rem;
    padding:92rem 92rem 80rem;
    background:#FFFFFF;
    overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-print-color-adjust:exact;
            print-color-adjust:exact;
  }

  /* ============ 装饰层：仅 2 处淡色几何（右上大圆+外环 / 左下圆角方） ============ */
  .deco{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  /* 圆心同在画布右上角外 (1200rem,40rem)：仅露弧线，出血出画 */
  .deco .circle{position:absolute;right:-400rem;top:-250rem;width:660rem;height:660rem;
    border-radius:50%;background:rgba(84,91,252,.075);}
  .deco .ring{position:absolute;right:-470rem;top:-320rem;width:820rem;height:820rem;
    border-radius:50%;border:4rem solid rgba(84,91,252,.15);}
  .deco .square{position:absolute;left:-120rem;bottom:-110rem;width:300rem;height:300rem;
    border-radius:64rem;background:rgba(124,111,247,.05);}

  /* ============ 内容列：纵向分组节奏间距（flex-start + 各区块 margin-top） ============ */
  .content{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  /* 分组节奏间距（rem）：品牌→主视觉 34 / 主视觉→数字带 40 / 数字带→三步 46 / 三步→扫码 24 / 扫码→页脚 36
     （后两处在规格 ±6rem 容差内收紧，以容纳放大后的二维码，确保画布不溢出、页脚不被裁切） */
  .hero{margin-top:34rem;}
  .band{margin-top:40rem;}
  .steps{margin-top:46rem;}
  .qr{margin-top:24rem;}
  .footer{margin-top:36rem;}
  .brand,.hero,.band,.steps,.qr,.footer{flex:0 0 auto;}

  /* ---------- A 品牌行 ---------- */
  .brand{display:flex;align-items:center;gap:18rem;height:56rem;}
  .brand .logo{width:56rem;height:56rem;flex:0 0 auto;display:block;}
  .brand .wordmark{height:44rem;width:auto;flex:0 0 auto;display:block;}
  .brand .site{margin-left:auto;font-size:22rem;letter-spacing:.08em;color:var(--muted);font-weight:500;
    font-variant-numeric:tabular-nums;}

  /* ---------- B 主视觉区（第一抓眼点） ---------- */
  .hero{padding-bottom:18rem;}
  .eyebrow{display:flex;align-items:center;gap:18rem;
    font-size:30rem;font-weight:700;color:var(--blue);letter-spacing:.18em;line-height:1;}
  .eyebrow::before{content:"";flex:0 0 auto;width:44rem;height:5rem;border-radius:3rem;background:var(--blue);}
  .title{margin:18rem 0 0;font-weight:900;}
  .title .t1,.title .t2{display:block;
    font-family:"Arial Black","Segoe UI Black","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:200rem;font-weight:900;line-height:.94;letter-spacing:-.02em;}
  .title .t1{color:var(--ink);}
  /* padding + 负 margin：扩大渐变背景盒以覆盖字形溢出，且不改变排版高度 */
  /* 变体1：对比反转 —— 第 2 行「自由」改为白字 + 品牌蓝渐变实心圆角块（行内块，色块只包住二字）
     行高沿用 .94 不变；用「上 8rem / 下 34rem」的非对称内边距把色块撑到 1.15em（实测 230rem），
     并用等量负外边距抵消，使排版高度与「自由」字形位置与 v2.1 完全一致。
     这样色块上沿落在「Token」墨迹下方约 5px（不压住 Token），下沿完整包住「自由」墨迹。 */
  .title .t2{display:inline-block;
    /* 取代 v2.1 的渐变文字裁剪做法 */
    background:var(--grad);
    -webkit-text-fill-color:#FFFFFF;color:#FFFFFF;
    border-radius:28rem;
    padding:8rem 26rem 34rem;margin:-8rem 0 -34rem;}

  /* ---------- C 数字带（全图唯一强色块 / 第二抓眼点） ---------- */
  .band{border-radius:36rem;border:1rem solid var(--line);
    background:linear-gradient(160deg,#F4F5FF,#EDEFFF);
    padding:32rem 34rem;}
  .band .cols{display:grid;grid-template-columns:1fr 1fr 1fr;}
  .band .col{position:relative;text-align:center;padding:0 8rem;}
  .band .col + .col::before{content:"";position:absolute;left:-8rem;top:24rem;bottom:24rem;width:1rem;background:var(--line2);}
  .band .num{display:flex;align-items:baseline;justify-content:center;gap:3rem;
    font-size:118rem;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--blue);
    font-variant-numeric:tabular-nums;}
  .band .num .u{font-size:64rem;font-weight:900;letter-spacing:0;}
  .band .lab{margin-top:16rem;font-size:28rem;font-weight:800;color:var(--ink);letter-spacing:.01em;}
  .band .desc{margin-top:8rem;font-size:21rem;line-height:1.4;color:var(--ink2);}
  .band .foot{margin-top:14rem;padding-top:12rem;border-top:1rem solid var(--line2);
    font-size:20rem;line-height:1.4;color:#656C82;text-align:center;}

  /* ---------- D 加入三步（横向三列） ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);}
  .step .n{font-size:36rem;font-weight:900;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums;}
  .step .s{margin-top:10rem;font-size:26rem;font-weight:600;color:var(--ink);}

  /* ---------- E 扫码区（第三抓眼点） ---------- */
  .qr{display:flex;flex-direction:column;align-items:center;}
  .qrcard{position:relative;width:396rem;height:396rem;padding:22rem;background:#FFFFFF;
    border-radius:28rem;box-shadow:0 18rem 44rem rgba(84,91,252,.10);
    display:flex;align-items:center;justify-content:center;}
  .qrcard svg{width:352rem;height:352rem;display:block;}
  .corner{position:absolute;width:46rem;height:46rem;border:6rem solid var(--blue);border-radius:8rem;}
  .corner.tl{left:-14rem;top:-14rem;border-right:0;border-bottom:0;}
  .corner.tr{right:-14rem;top:-14rem;border-left:0;border-bottom:0;}
  .corner.bl{left:-14rem;bottom:-14rem;border-right:0;border-top:0;}
  .corner.br{right:-14rem;bottom:-14rem;border-left:0;border-top:0;}
  .qr .qcap{margin-top:16rem;font-size:38rem;font-weight:800;color:var(--ink);letter-spacing:.02em;}
  .qr .qlink{margin-top:10rem;font-size:22rem;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums;}

  /* ---------- F 页脚 ---------- */
  .footer{border-top:1rem solid #EDEFF7;padding-top:18rem;}
  .footer p{margin:0;font-size:19rem;line-height:1.6;color:var(--muted);}
  .sign{margin-top:14rem;font-size:26rem;font-weight:800;color:var(--ink);letter-spacing:.02em;}
  .sign span{color:var(--blue);}

  /* ============ 打印规则（A3 竖版） ============ */
  @page{size:A3 portrait;margin:0;}
  @media print{
    html,body{width:auto;height:auto;overflow:visible;}
    .poster{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="poster">
  <!-- 装饰层 -->

    <div class="ring"></div>
    <div class="circle"></div>
    <div class="square"></div>
  </div>

  <div class="content">

    <!-- A 品牌行 -->
    <header class="brand">
      <svg class="logo" viewBox="-5 -5 112 112" preserveAspectRatio="xMidYMid meet" role="img" aria-label="知令 logo"><defs><linearGradient id="lg-a" x1="77.93" y1="62.37" x2="40" y2="107.58" gradientUnits="userSpaceOnUse"><stop offset=".13" stop-color="#43F218" stop-opacity="0"></stop><stop offset="1" stop-color="#43F218"></stop></linearGradient><linearGradient id="lg-b" x1="51" y1="26" x2="102" y2="26" gradientUnits="userSpaceOnUse"><stop offset=".13" stop-color="#545BFC" stop-opacity="0"></stop><stop offset="1" stop-color="#545BFC"></stop></linearGradient><linearGradient id="lg-c" x1="19.25" y1="76.58" x2="19.25" y2="7.41" gradientUnits="userSpaceOnUse"><stop offset=".13" stop-color="#FC1414" stop-opacity="0"></stop><stop offset="1" stop-color="#FC1414"></stop></linearGradient></defs><g><path d="M51 102a51 51 0 0 0 44-25.28L71.63 63.26a24 24 0 0 1-32 8.89L25 95a51.49 51.49 0 0 0 26 7z" fill="url(#lg-a)"></path><path d="M75 51v1h27v-1A51 51 0 0 0 51 0v27a24 24 0 0 1 24 24z" fill="url(#lg-b)"></path><circle cx="88.5" cy="51.5" r="13.5" fill="#545BFC"></circle><circle cx="33.2" cy="84" r="13.7" fill="#43F218"></circle><path d="M30.29 63.13a24 24 0 0 1 8.2-32.62l-14-23.1a51 51 0 0 0-17.6 69.17z" fill="url(#lg-c)"></path><circle cx="32.5" cy="18.5" r="13.5" fill="#FC1414"></circle></g></svg>

      <div class="site">zhiling.plus</div>
    </header>

    <!-- B 主视觉区 -->
    <section class="hero">

    <section class="band">

    <!-- D 加入三步 -->
    <section class="steps">

      <div class="step">

      <div class="step">
        <div class="n">03</div>
