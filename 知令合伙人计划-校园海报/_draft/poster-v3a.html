<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知令合伙人计划 · 校园海报 v3-A（草稿）</title>
<style>
  /* ============ 基础与双画布自适应 ============
     设计基准：1080 × 1920（9:16）。1rem = min(100vw/1080, 100vh/1920)。
     A3 竖版打印时按高度贴合，左右自动留白居中。 */
  html{
    font-size:min(0.0925926vw,0.0520833vh);
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  html,body{margin:0;padding:0;background:#FFFFFF;}
  body{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;}
  *{box-sizing:border-box;}

  :root{
    --blue:#545BFC;
    --blue2:#7C6FF7;
    --grad:linear-gradient(135deg,#545BFC,#7C6FF7);
    --ink:#0E1024;
    --ink2:#626A80;
    --muted:#656C82;
    --line:#E4E6F8;
    --line2:#D8DCF2;
  }

  .poster{
    position:relative;width:1080rem;height:1920rem;padding:92rem 92rem 76rem;
    background:#FFFFFF;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }

  /* ============ 装饰层 ============ */
  .deco{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .deco .circle{position:absolute;right:-400rem;top:-250rem;width:660rem;height:660rem;border-radius:50%;background:rgba(84,91,252,.075);}
  .deco .ring{position:absolute;right:-470rem;top:-320rem;width:820rem;height:820rem;border-radius:50%;border:4rem solid rgba(84,91,252,.15);}
  .deco .square{position:absolute;left:-120rem;bottom:-110rem;width:300rem;height:300rem;border-radius:64rem;background:rgba(124,111,247,.05);}

  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-start;}
  .brand,.hero,.band,.duo,.footer{flex:0 0 auto;}
  .hero{margin-top:30rem;}
  .band{margin-top:40rem;}
  .duo{margin-top:40rem;}
  .footer{margin-top:28rem;}

  /* ---------- A 品牌行：知令应用图标 + 知令字标 ---------- */
  .brand{display:flex;align-items:center;gap:18rem;height:62rem;}
  .brand .logo{width:62rem;height:62rem;flex:0 0 auto;display:block;}
  .brand .wordmark{height:42rem;width:auto;flex:0 0 auto;display:block;}

  /* ---------- B 主视觉区 ---------- */
  .hero{padding-bottom:12rem;padding-left:34rem;position:relative;}
  .hero::before{content:"";position:absolute;left:0;top:0;width:12rem;height:412rem;border-radius:6rem;background:var(--grad);}
  .eyebrow{display:flex;align-items:center;gap:18rem;font-size:30rem;font-weight:700;color:var(--blue);letter-spacing:.18em;line-height:1;}
  .eyebrow::before{content:"";flex:0 0 auto;width:44rem;height:5rem;border-radius:3rem;background:var(--blue);}
  .title{margin:14rem 0 0;font-weight:900;}
  .title .t1,.title .t2{display:block;
    font-family:"Arial Black","Segoe UI Black","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:200rem;font-weight:900;line-height:.94;letter-spacing:-.02em;}
  .title .t1{color:var(--ink);}
  .title .t2{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding:28rem 0;margin:-28rem 0;}

  /* ---------- C 数字带 ---------- */
  .band{border-radius:36rem;border:1rem solid var(--line);background:linear-gradient(160deg,#F4F5FF,#EDEFFF);padding:26rem 34rem;}
  .band .cols{display:grid;grid-template-columns:repeat(2,1fr);}
  .band .col{position:relative;text-align:center;padding:0 8rem;}
  .band .col + .col::before{content:"";position:absolute;left:-8rem;top:24rem;bottom:24rem;width:1rem;background:var(--line2);}
  .band .num{display:flex;align-items:baseline;justify-content:center;gap:3rem;font-size:132rem;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--blue);font-variant-numeric:tabular-nums;}
  .band .num .u{font-size:68rem;font-weight:900;letter-spacing:0;}
  .band .lab{margin-top:14rem;font-size:28rem;font-weight:800;color:var(--ink);letter-spacing:.01em;}
  .band .desc{margin-top:6rem;font-size:21rem;line-height:1.4;color:var(--ink2);}
  .band .foot{margin-top:12rem;padding-top:10rem;border-top:1rem solid var(--line2);font-size:20rem;line-height:1.4;color:#656C82;text-align:center;}

  /* ---------- D 底部两栏：左＝纵向三步（时间线） / 右＝行动区（网址 + 二维码） ---------- */
  .duo{display:grid;grid-template-columns:1fr 388rem;gap:60rem;align-items:stretch;}
  .col-left{display:flex;flex-direction:column;}

  .kicker{display:flex;align-items:center;gap:14rem;height:32rem;font-size:26rem;font-weight:800;color:var(--blue);letter-spacing:.16em;line-height:1;}
  .kicker::before{content:"";flex:0 0 auto;width:38rem;height:5rem;border-radius:3rem;background:var(--blue);}

  .steps{position:relative;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between;margin-top:26rem;padding:4rem 0;}
  .steps::before{content:"";position:absolute;left:31rem;top:32rem;bottom:32rem;width:2rem;background:linear-gradient(180deg,#C3C8F4,#E4E6F8);}
  .step{position:relative;display:flex;align-items:center;gap:26rem;}
  .step .n{width:64rem;height:64rem;border-radius:50%;background:#FFFFFF;border:3rem solid var(--blue);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:26rem;font-weight:900;line-height:1;
    font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .step .s{font-size:29rem;font-weight:700;color:var(--ink);letter-spacing:.01em;}

  .action{display:flex;flex-direction:column;align-items:center;}
  .url{text-align:center;line-height:1;}
  .url .scheme{display:block;font-size:26rem;font-weight:700;color:var(--blue);letter-spacing:.14em;margin-bottom:8rem;}
  .url .host{display:block;font-size:54rem;font-weight:900;color:var(--ink);letter-spacing:-.025em;}
  .url .rule{width:96rem;height:5rem;border-radius:3rem;background:var(--grad);margin:16rem auto 0;}

  .qrcard{position:relative;width:356rem;height:356rem;margin-top:22rem;padding:22rem;background:#FFFFFF;border:1rem solid var(--line);
    border-radius:28rem;box-shadow:0 18rem 44rem rgba(84,91,252,.10);display:flex;align-items:center;justify-content:center;}
  .qrcard svg{width:312rem;height:312rem;display:block;}
  .corner{position:absolute;width:46rem;height:46rem;border:6rem solid var(--blue);border-radius:8rem;}
  .corner.tl{left:-14rem;top:-14rem;border-right:0;border-bottom:0;}
  .corner.tr{right:-14rem;top:-14rem;border-left:0;border-bottom:0;}
  .corner.bl{left:-14rem;bottom:-14rem;border-right:0;border-top:0;}
  .corner.br{right:-14rem;bottom:-14rem;border-left:0;border-top:0;}
  .qcap{margin-top:20rem;font-size:30rem;font-weight:800;color:var(--ink);letter-spacing:.02em;}
  .qsub{margin-top:8rem;font-size:21rem;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums;}

  /* ---------- F 页脚 ---------- */
  .footer{border-top:1rem solid #EDEFF7;padding-top:16rem;}
  .footer p{margin:0;font-size:19rem;line-height:1.6;color:var(--muted);}
  .footer .sign{margin-top:10rem;font-size:21rem;font-weight:700;color:var(--ink);letter-spacing:.04em;}
  .footer .sign span{color:var(--blue);}

  @page{size:A3 portrait;margin:0;}
  @media print{
    html,body{width:auto;height:auto;overflow:visible;}
    .poster{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div class="poster">

    <!-- F 页脚 -->
