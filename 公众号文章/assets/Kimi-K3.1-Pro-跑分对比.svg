<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect width="1200" height="680" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="30" font-weight="700" fill="#1F2430">Kimi K3.1 Pro 官方跑分</text>
  <rect x="48" y="66" width="56" height="4" rx="2" fill="#1E3A5F"/>
  <text x="48" y="98" font-size="15.5" fill="#6B7280">与 Claude Opus 5.5、GPT-6 Astra 同口径对比　·　数据来自 Kimi 官方技术博客</text>

  <rect x="48" y="122" width="14" height="14" rx="3" fill="#1E3A5F"/>
  <text x="70" y="134" font-size="14.5" font-weight="700" fill="#1E3A5F">Kimi K3.1 Pro</text>
  <rect x="214" y="122" width="14" height="14" rx="3" fill="#C9B6FF"/>
  <text x="236" y="134" font-size="14.5" fill="#6B7280">Claude Opus 5.5</text>
  <rect x="400" y="122" width="14" height="14" rx="3" fill="#8FA6FF"/>
  <text x="422" y="134" font-size="14.5" fill="#6B7280">GPT-6 Astra</text>

  <line x1="48" y1="160" x2="1152" y2="160" stroke="#F0F2F5" stroke-width="1"/>

  <!-- 刻度线：25 / 50 / 75 / 100，贯穿两组柱 -->
  <g stroke="#E9EDF4" stroke-width="1" stroke-dasharray="4 3">
    <line x1="450" y1="186" x2="450" y2="512"/>
    <line x1="640" y1="186" x2="640" y2="512"/>
    <line x1="830" y1="186" x2="830" y2="512"/>
    <line x1="1020" y1="186" x2="1020" y2="512"/>
  </g>
  <line x1="260" y1="186" x2="260" y2="512" stroke="#DDE3EC" stroke-width="1.5"/>

  <!-- ===== 编程 ===== -->
  <text x="48" y="206" font-size="18" font-weight="700" fill="#1F2430">编程 · Terminal-Bench 4.0</text>
  <rect x="948" y="186" width="204" height="26" rx="13" fill="#F4F6FA"/>
  <text x="1050" y="204" font-size="13" font-weight="700" fill="#1E3A5F" text-anchor="middle">距 Opus 5.5 仅 0.7 分</text>

  <!-- Opus 66.4 → 504.6 -->
  <text x="244" y="251" font-size="15" fill="#4B5563" text-anchor="end">Claude Opus 5.5</text>
  <rect x="260" y="234" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="234" width="504.6" height="24" rx="12" fill="#C9B6FF"/>
  <text x="774" y="251" font-size="14" font-weight="700" fill="#6D5BD0">66.4</text>

  <!-- Kimi 65.7 → 499.3 -->
  <text x="244" y="293" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="end">Kimi K3.1 Pro</text>
  <rect x="260" y="276" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="276" width="499.3" height="24" rx="12" fill="#1E3A5F"/>
  <text x="768" y="293" font-size="14" font-weight="700" fill="#1E3A5F">65.7</text>

  <!-- Astra 58.2 → 442.3 -->
  <text x="244" y="335" font-size="15" fill="#4B5563" text-anchor="end">GPT-6 Astra</text>
  <rect x="260" y="318" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="318" width="442.3" height="24" rx="12" fill="#8FA6FF"/>
  <text x="712" y="335" font-size="14" font-weight="700" fill="#4C6FE0">58.2</text>

  <!-- ===== 3D ===== -->
  <text x="48" y="388" font-size="18" font-weight="700" fill="#1F2430">3D · BenchCAD（借助工具）</text>

  <!-- Opus 96.2 → 731.1 -->
  <text x="244" y="433" font-size="15" fill="#4B5563" text-anchor="end">Claude Opus 5.5</text>
  <rect x="260" y="416" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="416" width="731.1" height="24" rx="12" fill="#C9B6FF"/>
  <text x="1000" y="433" font-size="14" font-weight="700" fill="#6D5BD0">96.2</text>

  <!-- Astra 95.9 → 728.8 -->
  <text x="244" y="475" font-size="15" fill="#4B5563" text-anchor="end">GPT-6 Astra</text>
  <rect x="260" y="458" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="458" width="728.8" height="24" rx="12" fill="#8FA6FF"/>
  <text x="998" y="475" font-size="14" font-weight="700" fill="#4C6FE0">95.9</text>

  <!-- Kimi 92.7 → 704.5 -->
  <text x="244" y="517" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="end">Kimi K3.1 Pro</text>
  <rect x="260" y="500" width="760" height="24" rx="12" fill="#F3F5F8"/>
  <rect x="260" y="500" width="704.5" height="24" rx="12" fill="#1E3A5F"/>
  <text x="974" y="517" font-size="14" font-weight="700" fill="#1E3A5F">92.7</text>

  <!-- 刻度 -->
  <g font-size="12.5" fill="#9AA0AC" text-anchor="middle">
    <text x="260" y="548">0</text>
    <text x="450" y="548">25</text>
    <text x="640" y="548">50</text>
    <text x="830" y="548">75</text>
    <text x="1020" y="548">100</text>
  </g>

  <text x="48" y="592" font-size="13.5" fill="#9AA0AC">两项均为官方公布的借助工具成绩，同组内可直接比较。分数为百分比，越高越好。</text>
  <text x="48" y="616" font-size="13.5" fill="#9AA0AC">数据来源：kimi.com/blog/kimi-k3-1-pro</text>
</svg>
