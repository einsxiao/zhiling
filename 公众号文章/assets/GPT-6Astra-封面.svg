  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1E4B"/>
      <stop offset="0.55" stop-color="#1457B5"/>
      <stop offset="1" stop-color="#3780FF"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.85">
