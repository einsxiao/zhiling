    <radialGradient id="sphereGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA0FF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#5AA0FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5AA0FF" stop-opacity="0"/>
