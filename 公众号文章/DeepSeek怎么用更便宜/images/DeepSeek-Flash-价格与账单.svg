<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="0.6" stop-color="#10395A"/>
      <stop offset="1" stop-color="#0E5A73"/>
    </linearGradient>
    <linearGradient id="barGood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barBad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="barOfficial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="#F5F8FC"/>

  <!-- Header -->
  <rect width="1200" height="210" fill="url(#header)"/>
  <circle cx="1080" cy="40" r="130" fill="#22D3EE" opacity="0.08"/>
  <circle cx="1150" cy="180" r="90" fill="#34D399" opacity="0.08"/>
  <text x="60" y="92" font-size="46" font-weight="700" fill="#FFFFFF">DeepSeek V4.1 Flash</text>
  <text x="60" y="140" font-size="28" fill="#7DD3FC">价格与站内真实账单</text>
  <text x="1140" y="86" font-size="20" fill="#CBD5E1" text-anchor="end">知令 · 近 30 天</text>
  <text x="1140" y="122" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="end">34.8 万次调用</text>

  <!-- Section 1: price -->
  <text x="60" y="262" font-size="26" font-weight="700" fill="#0F2742">站内价格（元 / 百万 tokens）</text>
  <rect x="60" y="280" width="1080" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="60" y="280" width="1080" height="56" rx="16" fill="#EEF4FB"/>
  <rect x="60" y="320" width="1080" height="16" fill="#EEF4FB"/>
  <text x="100" y="316" font-size="19" fill="#475569">时段</text>
  <text x="380" y="316" font-size="19" fill="#475569">输入（缓存命中）</text>
  <text x="680" y="316" font-size="19" fill="#475569">输入（未命中）</text>
  <text x="980" y="316" font-size="19" fill="#475569">输出</text>

  <rect x="60" y="336" width="1080" height="64" fill="#F8FBFE"/>
  <text x="100" y="372" font-size="24" font-weight="700" fill="#0F2742">闲时</text>
  <text x="100" y="396" font-size="15" fill="#94A3B8">其余时间含周末</text>
  <text x="380" y="382" font-size="30" font-weight="700" fill="#059669">0.02</text>
  <text x="680" y="382" font-size="30" font-weight="700" fill="#0F2742">1</text>
  <text x="980" y="382" font-size="30" font-weight="700" fill="#0F2742">4</text>

  <text x="100" y="436" font-size="24" font-weight="700" fill="#B45309">高峰</text>
  <text x="100" y="460" font-size="15" fill="#94A3B8">工作日两个时段</text>
  <text x="380" y="446" font-size="30" font-weight="700" fill="#D97706">0.04</text>
  <text x="680" y="446" font-size="30" font-weight="700" fill="#B45309">2</text>
  <text x="980" y="446" font-size="30" font-weight="700" fill="#B45309">8</text>

  <text x="60" y="542" font-size="17" fill="#64748B">高峰：工作日 9:00–12:00、14:00–18:00；其余时间（含周末）按闲时价。</text>

  <!-- Section 2: real usage -->
  <text x="60" y="592" font-size="26" font-weight="700" fill="#0F2742">站内近 30 天实测</text>

  <rect x="60" y="620" width="255" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="656" font-size="17" fill="#64748B">调用次数</text>
  <text x="84" y="708" font-size="38" font-weight="700" fill="#0F2742">34.8 万</text>
  <text x="84" y="734" font-size="15" fill="#94A3B8">近 30 天 Flash 调用</text>

  <rect x="335" y="620" width="255" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="359" y="656" font-size="17" fill="#64748B">单次平均</text>
  <text x="359" y="708" font-size="38" font-weight="700" fill="#0F2742">¥0.011</text>
  <text x="359" y="734" font-size="15" fill="#94A3B8">约 1 分钱一次</text>

  <rect x="610" y="620" width="255" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="634" y="656" font-size="17" fill="#64748B">输入缓存命中率</text>
  <text x="634" y="708" font-size="38" font-weight="700" fill="#059669">98.35%</text>
  <text x="634" y="734" font-size="15" fill="#94A3B8">输入 token 口径</text>

  <rect x="885" y="620" width="255" height="130" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="909" y="656" font-size="17" fill="#64748B">等效价</text>
  <text x="909" y="708" font-size="38" font-weight="700" fill="#0F2742">≈¥0.09</text>
  <text x="909" y="734" font-size="15" fill="#94A3B8">每百万 token</text>

  <!-- Section 3: one request -->
  <text x="60" y="820" font-size="26" font-weight="700" fill="#0F2742">一次典型 Flash 请求：12.5 万输入 + 966 输出</text>
  <rect x="60" y="850" width="1080" height="170" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="84" y="890" font-size="19" fill="#475569">命中缓存（98% 输入复用）</text>
  <rect x="84" y="905" width="61" height="26" rx="13" fill="url(#barGood)"/>
  <text x="160" y="927" font-size="24" font-weight="700" fill="#059669">0.9 分</text>

  <text x="84" y="958" font-size="19" fill="#475569">全部未命中（每次重读上下文）</text>
  <rect x="84" y="973" width="900" height="26" rx="13" fill="url(#barBad)"/>
  <text x="1000" y="995" font-size="24" font-weight="700" fill="#DC2626">13.3 分</text>
  <text x="1104" y="940" font-size="42" font-weight="700" fill="#DC2626" text-anchor="end">15×</text>

  <!-- Section 4: channels -->
  <text x="60" y="1062" font-size="26" font-weight="700" fill="#0F2742">别只看输入价：同结构复算</text>
  <rect x="60" y="1090" width="1080" height="250" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="84" y="1132" font-size="19" fill="#0F2742" font-weight="700">官方 Flash</text>
  <rect x="330" y="1116" width="405" height="22" rx="11" fill="url(#barOfficial)"/>
  <text x="748" y="1134" font-size="19" fill="#0F2742">0.085</text>
  <text x="820" y="1134" font-size="17" fill="#94A3B8">基准</text>

  <text x="84" y="1182" font-size="19" fill="#475569">cloudflare</text>
  <rect x="330" y="1166" width="420" height="22" rx="11" fill="#93C5FD"/>
  <text x="763" y="1184" font-size="19" fill="#0F2742">0.088</text>
  <text x="835" y="1184" font-size="17" fill="#D97706">+4%</text>

  <text x="84" y="1232" font-size="19" fill="#475569">inference-net</text>
  <rect x="330" y="1216" width="587" height="22" rx="11" fill="#FCA5A5"/>
  <text x="930" y="1234" font-size="19" fill="#0F2742">0.123</text>
  <text x="1002" y="1234" font-size="17" fill="#DC2626">+32%</text>

  <text x="84" y="1282" font-size="19" fill="#475569">relace</text>
  <rect x="330" y="1266" width="591" height="22" rx="11" fill="#F87171"/>
  <text x="934" y="1284" font-size="19" fill="#0F2742">0.124</text>
  <text x="1006" y="1284" font-size="17" fill="#DC2626">+33%</text>

  <!-- Footer -->
  <text x="60" y="1382" font-size="17" fill="#94A3B8">数据：知令生产站 ModelUsageRecord，2026-10-03 至 11-02，近 30 天。</text>
  <text x="60" y="1410" font-size="17" fill="#94A3B8">费用按站内价目含 3% 转发费率；等效价 = 总费用 ÷ 总 token × 100 万。</text>
  <text x="60" y="1438" font-size="17" fill="#94A3B8">渠道溢价按各自真实 token 结构复算，与官方 Flash 闲时价对比。</text>
</svg>
