<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="0.6" stop-color="#10395A"/>
      <stop offset="1" stop-color="#0E5A73"/>
    </linearGradient>
    <linearGradient id="barGood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="barBad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1300" fill="#F5F8FC"/>

  <!-- Header -->
  <rect width="1200" height="200" fill="url(#header)"/>
  <circle cx="1080" cy="30" r="120" fill="#22D3EE" opacity="0.08"/>
  <circle cx="1150" cy="170" r="80" fill="#34D399" opacity="0.08"/>
  <text x="60" y="86" font-size="46" font-weight="700" fill="#FFFFFF">DeepSeek V4.1 Flash</text>
  <text x="60" y="134" font-size="28" fill="#7DD3FC">峰时切换方案</text>
  <text x="1140" y="82" font-size="19" fill="#CBD5E1" text-anchor="end">知令 · 站内实测</text>
  <text x="1140" y="128" font-size="34" font-weight="700" fill="#34D399" text-anchor="end">省 45%</text>

  <!-- Section 1: price table -->
  <text x="60" y="254" font-size="26" font-weight="700" fill="#0F2742">三套价格（元 / 百万 tokens）</text>
  <rect x="60" y="276" width="1080" height="250" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="60" y="276" width="1080" height="56" rx="16" fill="#EEF4FB"/>
  <rect x="60" y="316" width="1080" height="16" fill="#EEF4FB"/>
  <text x="100" y="312" font-size="19" fill="#475569">渠道 / 时段</text>
  <text x="480" y="312" font-size="19" fill="#475569">缓存命中</text>
  <text x="760" y="312" font-size="19" fill="#475569">未命中</text>
  <text x="1010" y="312" font-size="19" fill="#475569">输出</text>

  <rect x="60" y="332" width="1080" height="64" fill="#F8FBFE"/>
  <text x="100" y="374" font-size="24" font-weight="700" fill="#047857">官方 · 闲时</text>
  <text x="480" y="374" font-size="28" font-weight="700" fill="#059669">0.02</text>
  <text x="760" y="374" font-size="28" font-weight="700" fill="#0F2742">1</text>
  <text x="1010" y="374" font-size="28" font-weight="700" fill="#0F2742">4</text>

  <text x="100" y="438" font-size="24" font-weight="700" fill="#B45309">官方 · 峰时</text>
  <text x="480" y="438" font-size="28" font-weight="700" fill="#D97706">0.04</text>
  <text x="760" y="438" font-size="28" font-weight="700" fill="#B45309">2</text>
  <text x="1010" y="438" font-size="28" font-weight="700" fill="#B45309">8</text>

  <rect x="60" y="460" width="1080" height="66" fill="#F8FBFE"/>
  <text x="100" y="504" font-size="24" font-weight="700" fill="#0369A1">Cloudflare</text>
  <text x="480" y="504" font-size="28" font-weight="700" fill="#0284C7">0.024</text>
  <text x="760" y="504" font-size="28" font-weight="700" fill="#0284C7">0.80</text>
  <text x="1010" y="504" font-size="28" font-weight="700" fill="#0284C7">4.8</text>

  <text x="60" y="560" font-size="17" fill="#64748B">Cloudflare 无峰谷，全天按上表计价；官方高峰为工作日两个时段，其余时间含周末按闲时。</text>

  <!-- Section 2: decision -->
  <text x="60" y="612" font-size="26" font-weight="700" fill="#0F2742">怎么选</text>
  <text x="1140" y="610" font-size="16" fill="#64748B" text-anchor="end">高峰：工作日 9:00–12:00、14:00–18:00</text>

  <rect x="60" y="632" width="520" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="60" y="632" width="8" height="150" rx="4" fill="#10B981"/>
  <text x="96" y="676" font-size="18" fill="#64748B">闲时</text>
  <text x="96" y="718" font-size="30" font-weight="700" fill="#047857">用官方 Flash</text>
  <text x="96" y="756" font-size="20" fill="#475569">0.86 分 / 次</text>

  <rect x="620" y="632" width="520" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="620" y="632" width="8" height="150" rx="4" fill="#0EA5E9"/>
  <text x="656" y="676" font-size="18" fill="#64748B">峰时</text>
  <text x="656" y="718" font-size="30" font-weight="700" fill="#0369A1">用 Cloudflare</text>
  <text x="656" y="756" font-size="20" fill="#475569">0.95 分 / 次</text>

  <!-- Section 3: bars -->
  <text x="60" y="834" font-size="26" font-weight="700" fill="#0F2742">一次典型请求的费用</text>
  <rect x="60" y="856" width="1080" height="320" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- row 1 -->
  <text x="100" y="916" font-size="21" font-weight="700" fill="#047857">官方 · 闲时</text>
  <rect x="400" y="890" width="500" height="34" rx="17" fill="#EEF2F7"/>
  <rect x="400" y="890" width="249" height="34" rx="17" fill="url(#barGood)"/>
  <text x="1090" y="916" font-size="28" font-weight="700" fill="#047857" text-anchor="end">0.86 分</text>

  <!-- row 2 -->
  <text x="100" y="996" font-size="21" font-weight="700" fill="#0369A1">Cloudflare</text>
  <rect x="400" y="970" width="500" height="34" rx="17" fill="#EEF2F7"/>
  <rect x="400" y="970" width="275" height="34" rx="17" fill="url(#barBlue)"/>
  <text x="1090" y="996" font-size="28" font-weight="700" fill="#0369A1" text-anchor="end">0.95 分</text>

  <!-- row 3 -->
  <text x="100" y="1076" font-size="21" font-weight="700" fill="#B45309">官方 · 峰时</text>
  <rect x="400" y="1050" width="500" height="34" rx="17" fill="#EEF2F7"/>
  <rect x="400" y="1050" width="500" height="34" rx="17" fill="url(#barBad)"/>
  <text x="1090" y="1076" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="end">1.73 分</text>

  <text x="100" y="1136" font-size="18" fill="#64748B">峰时从 1.73 分切到 0.95 分，省 45%，几乎砍半。</text>

  <!-- Footer -->
  <text x="60" y="1216" font-size="16" fill="#94A3B8">口径：按站内近 30 天 Flash 平均 token 结构（输入 12.5 万、缓存命中 98.35%、输出 966），含 3% 转发费率。</text>
  <text x="60" y="1244" font-size="16" fill="#94A3B8">高峰：工作日 9:00–12:00、14:00–18:00；其余时间含周末按闲时价。价格以知令模型价格页为准。</text>
</svg>
